<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Organizer del primo semestre di Ingegneria dell'automazione: programmi, doppia barra prof/tu, orario, scadenze e libretto.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BRANDUNI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BRANDUNI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column on graph paper, app shell with bottom tabs; each course is a sheet with a hatched "prof" bar under a solid "you" bar. */
:root{
  --paper:#EEF1F5;
  --sheet:#FFFFFF;
  --ink:#0F1A2A;
  --ink-2:#465367;
  --ink-3:#7F8A9C;
  --rule:#D9DFE7;
  --grid:rgba(15,26,42,.055);
  --c-an:#2B48D6;
  --c-geo:#0A8C7B;
  --c-inf:#D2502A;
  --on-cc:#FFFFFF;
  --ok:#1C7F46; --ok-bg:#DFF1E6;
  --warn:#9A6410; --warn-bg:#FBEBCB;
  --late:#B8362F; --late-bg:#F9DEDB;
  --focus:#2B48D6;
  --scrim:rgba(15,26,42,.38);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A0F18;--sheet:#121A27;--ink:#E7ECF4;--ink-2:#A6B1C2;--ink-3:#6C788B;--rule:#253145;--grid:rgba(231,236,244,.04);
  --c-an:#7E93FF;--c-geo:#3FCBB6;--c-inf:#FF8C5E;--on-cc:#0A0F18;
  --ok:#5BD08F;--ok-bg:#12301F;--warn:#E8B75A;--warn-bg:#35280F;--late:#F2837A;--late-bg:#3A1A18;--focus:#7E93FF;--scrim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A0F18;--sheet:#121A27;--ink:#E7ECF4;--ink-2:#A6B1C2;--ink-3:#6C788B;--rule:#253145;--grid:rgba(231,236,244,.04);
  --c-an:#7E93FF;--c-geo:#3FCBB6;--c-inf:#FF8C5E;--on-cc:#0A0F18;
  --ok:#5BD08F;--ok-bg:#12301F;--warn:#E8B75A;--warn-bg:#35280F;--late:#F2837A;--late-bg:#3A1A18;--focus:#7E93FF;--scrim:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
.statusbg{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-stretch:125%;font-weight:750;letter-spacing:-.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
a{color:inherit}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 2px}
.brand{font-family:var(--f-display);font-stretch:125%;font-size:13px;letter-spacing:.2em;font-weight:800}
.sync{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync[data-s="cloud"] i{background:var(--ok)}
.sync[data-s="error"] i{background:var(--late)}
.hello{display:flex;flex-direction:column;gap:6px;padding-block:14px 4px}
.hello h1{font-size:30px;line-height:1.05}

/* semester ruler */
.ruler{padding-block:10px 2px}
.rl-track{position:relative;height:10px;border-radius:2px;background:var(--sheet);border:1px solid var(--rule)}
.rl-fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:1px}
.rl-ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px calc(100%/14));opacity:.9}
.rl-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-3)}
.rl-block{position:absolute;top:0;bottom:0;background-image:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 4px)}
.rl-now{position:absolute;top:-7px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink);transform:translateX(-6px)}
.rl-labels{display:flex;justify-content:space-between;margin-top:7px;gap:8px}
.rl-labels span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}

/* cards */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.course{text-align:left;width:100%;transition:transform .15s ease}
.course:active{transform:scale(.99)}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.c-name{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:18px;line-height:1.15}
.c-cfu{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.c-prof{font-size:13px;color:var(--ink-2);margin-top:2px}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--cc);margin-right:8px;vertical-align:1px}

/* the dual bar */
.bar{position:relative;height:14px;border-radius:7px;background:color-mix(in srgb,var(--rule) 70%,transparent)}
.bar.big{height:20px;border-radius:10px}
.bar .p{position:absolute;inset:0 auto 0 0;border-radius:inherit;background-color:color-mix(in srgb,var(--cc) 14%,transparent);background-image:repeating-linear-gradient(135deg,var(--cc) 0 1.6px,transparent 1.6px 5px);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .m{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--cc);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .t{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.counts{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.counts b{color:var(--ink);font-weight:600}
.chip{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--rule);color:var(--ink-2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.late{background:var(--late-bg);color:var(--late)}
.chip.ahead{background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.next{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.next b{color:var(--ink);font-weight:600}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:18px;height:9px;border-radius:3px;display:inline-block}
.lg.p{background-color:color-mix(in srgb,var(--ink-2) 12%,transparent);background-image:repeating-linear-gradient(135deg,var(--ink-2) 0 1.4px,transparent 1.4px 4px)}
.lg.m{background:var(--ink-2)}
.lg.t{width:2px;height:13px;background:var(--ink);border-radius:1px}

.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px}
.sec-title h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:16px}
.linkbtn{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* deadlines */
.dl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:11px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.dl:last-child{border-bottom:0}
.dl-date{display:flex;flex-direction:column;align-items:center;line-height:1}
.dl-date .d{font-family:var(--f-display);font-stretch:125%;font-weight:750;font-size:21px}
.dl-date .mo{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.dl-title{font-weight:600;font-size:14.5px;line-height:1.25}
.dl-sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dl-when{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.dl.past{opacity:.5}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.tag i{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--cc,var(--ink-3));margin-right:5px;vertical-align:0}
.list{padding-block:4px}

/* detail */
.bartop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;margin-inline:-16px;padding-inline:16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;padding:6px 8px 6px 0}
.d-head{display:flex;flex-direction:column;gap:6px;padding-block:6px 2px}
.d-head h1{font-size:27px;line-height:1.08}
.profin{border:0;border-bottom:1px dashed var(--rule);background:transparent;padding:4px 0;font-size:14px;color:var(--ink-2);width:100%}
.profin::placeholder{color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-stretch:125%;font-weight:750;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.stat .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.section{display:flex;flex-direction:column}
.s-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-block:18px 6px;border-bottom:1.5px solid var(--ink)}
.s-head h3{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:15px}
.s-head .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.s-num{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-right:8px;font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--rule)}
.row .txt{text-align:left;font-size:14.5px;line-height:1.35;min-width:0}
.row .txt .cst{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);margin-left:6px;letter-spacing:.05em}
.row.done .txt{color:var(--ink-2)}
.tgs{display:flex;gap:6px}
.tg{font-family:var(--f-mono);font-size:11px;font-weight:500;min-width:48px;padding:7px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-3);text-align:center;transition:background-color .15s,color .15s,border-color .15s}
.tg.p[aria-pressed="true"]{border-color:color-mix(in srgb,var(--cc) 50%,transparent);color:var(--cc);background-color:color-mix(in srgb,var(--cc) 12%,transparent);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--cc) 35%,transparent) 0 1.2px,transparent 1.2px 5px)}
.tg.m[aria-pressed="true"]{border-color:var(--cc);background:var(--cc);color:var(--on-cc)}
.addrow{align-self:flex-start;margin-top:8px}
.appello{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:9px;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.appello:last-of-type{border-bottom:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;border:1px solid var(--rule);background:var(--sheet)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,transparent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-style:dashed;color:var(--ink-2);font-weight:500;font-size:13.5px;padding:9px 14px}

/* empty */
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;font-size:14px;color:var(--ink-2);max-width:40ch}

/* timetable */
.day{display:flex;flex-direction:column}
.day h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding-block:14px 6px;display:flex;gap:8px;align-items:center}
.day.today h3{color:var(--ink)}
.day.today h3::after{content:"oggi";font-size:10px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--paper);letter-spacing:.06em}
.lesson{display:grid;grid-template-columns:62px 4px minmax(0,1fr);gap:12px;align-items:center;padding:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;text-align:left;width:100%;margin-bottom:8px}
.lesson .tm{font-family:var(--f-mono);font-size:12.5px;line-height:1.3;font-variant-numeric:tabular-nums}
.lesson .tm span{color:var(--ink-3)}
.lesson .bar-v{align-self:stretch;border-radius:2px;background:var(--cc)}
.lesson .nm{font-weight:600;font-size:14.5px}
.lesson .rm{font-size:12.5px;color:var(--ink-2)}

/* libretto */
.exam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.exam:last-child{border-bottom:0}
.exam .nm{font-weight:600;font-size:14.5px}
.exam .cf{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.grade{font-family:var(--f-display);font-stretch:125%;font-weight:750;font-size:20px;font-variant-numeric:tabular-nums}
.grade.none{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink-3);font-stretch:100%}
.bar.ink .m{background:var(--ink)}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.note a{color:var(--ink-2)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;font-weight:500;color:var(--ink-3)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:480px;background:var(--sheet);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);align-self:center}
.sheet h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select{padding:11px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:16px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{font-size:13px;color:var(--late);min-height:0}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.acts{display:flex;flex-direction:column;gap:8px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="statusbg" aria-hidden="true"></div>
<div class="app" id="app">
  <div class="top">
    <span class="brand">BRANDUNI</span>
    <span class="sync" id="sync" data-s="local"><i></i><span>Salvato su questo dispositivo</span></span>
    <span class="sync" id="todaylbl" hidden></span>
  </div>
  <main id="screen-home"></main>
  <main id="screen-course" hidden></main>
  <main id="screen-orario" hidden></main>
  <main id="screen-scadenze" hidden></main>
  <main id="screen-libretto" hidden></main>
</div>

<div class="tabs">
  <nav aria-label="Sezioni">
    <button class="tab" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>Corsi</button>
    <button class="tab" data-tab="orario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Orario</button>
    <button class="tab" data-tab="scadenze">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg>Scadenze</button>
    <button class="tab" data-tab="libretto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/></svg>Libretto</button>
  </nav>
</div>

<div id="sheet-root"></div>

<script>
(function(){
"use strict";

/* ---------- Official data (Guida dello studente 2025/26, calendario didattico 2026/27) ---------- */
var GUIDA = "https://ingegneria-automazione.dieti.unina.it/attachments/article/23/L-IAUT_guida_25_26.pdf";
var CAL = "https://www.scuolapsb.unina.it/wp-content/uploads/2026/08/Calendario_didattico_AA_26_27_Ingegneria.pdf";
var AGENDA = "http://easyacademy.unina.it/agendastudenti/index.php?view=easycourse&_lang=it";

var COURSES = [
 {key:"an", name:"Analisi matematica I", short:"Analisi I", cfu:9, color:"var(--c-an)",

function normalize(s){var f=fresh();if(!s||typeof s!=="object")return f;
 Object.keys(f).forEach(function(k){if(s[k]===undefined)s[k]=f[k];});
 ["progress","custom","prof","appelli"].forEach(function(k){COURSES.forEach(function(c){if(s[k][c.key]===undefined)s[k][c.key]=f[k][c.key];});});
 return s;}
function loadLocal(){try{var r=localStorage.getItem(LS_KEY)||localStorage.getItem("setpoint-v1");return r?normalize(JSON.parse(r)):null;}catch(e){return null;}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function hasData(s){try{return JSON.stringify(s)!==JSON.stringify(fresh());}catch(e){return false;}}
var state=loadLocal()||fresh();

/* ---------- Sync through the artifact store ---------- */
var docRef=null, timer=null, writing=false, again=false, remoteSeen=false;
function setSync(s){var el=document.getElementById("sync");el.dataset.s=s;
 el.lastElementChild.textContent = s==="cloud"?"Sincronizzato":s==="error"?"Non sincronizzato, riprovo":"Salvato su questo dispositivo";}
function commit(){saveLocal();render();if(docRef){clearTimeout(timer);timer=setTimeout(flush,700);}}
function flush(){timer=null;if(!docRef)return;if(writing){again=true;return;}writing=true;
 var body=JSON.parse(JSON.stringify(state));
 docRef.set(body).then(function(){setSync("cloud");},function(e){
   if(e&&e.code==="unavailable"){setTimeout(function(){timer=null;flush();},1200+Math.random()*800);}
   setSync("error");}).then(function(){writing=false;if(again){again=false;flush();}});}
function initStore(){
 if(!window.claude||typeof window.claude.use!=="function")return;
 window.claude.use("db").then(function(db){
  if(!db)return;
  try{docRef=db.doc("state/main");}catch(e){docRef=null;return;}
  docRef.onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.exists){ if(!remoteSeen){remoteSeen=true; if(hasData(state))flush(); else setSync("cloud");} return; }
    remoteSeen=true;
    if(timer||writing){return;}
    var incoming=normalize(JSON.parse(JSON.stringify(snap.data())));
    if(JSON.stringify(incoming)!==JSON.stringify(state)){state=incoming;saveLocal();render();}
    setSync("cloud");
  },function(){docRef=null;setSync("local");});
 },function(){});
}

/* ---------- Helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
var DAY=86400000;
function diffDays(a,b){return Math.round((b-a)/DAY);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function fmtLong(d){return GIORNI[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()];}
function num(x){return x.toLocaleString("it-IT",{maximumFractionDigits:1});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function when(d,e){var t=today(),n=diffDays(t,d);
 if(e&&t>=d&&t<=e)return "in corso";
 if(n===0)return "oggi"; if(n===1)return "domani"; if(n>1)return "tra "+n+" g";
 return n===-1?"ieri":(-n)+" g fa";}

function topics(c){var out=[];c.secs.forEach(function(s,si){s[2].forEach(function(t,ti){out.push({id:c.key+"-"+si+"-"+ti,sec:si,t:t});});
  (state.custom[c.key]||[]).forEach(function(x){if(x.s===si)out.push({id:x.id,sec:si,t:x.t,custom:true});});});return out;}
function stats(c){var tp=topics(c),pr=state.progress[c.key]||{},p=0,m=0,behind=[],ahead=0,nextStudy=null;
 tp.forEach(function(x){var s=pr[x.id]||{};if(s.p)p++;if(s.m)m++;
  if(s.p&&!s.m)behind.push(x); if(s.m&&!s.p)ahead++; if(!s.m&&!nextStudy)nextStudy=x;});
 return {total:tp.length,p:p,m:m,behind:behind,ahead:ahead,next:behind[0]||nextStudy};}
function semFrac(){var t=today();return Math.max(0,Math.min(1,(t-SEM_START)/(SEM_END-SEM_START)));}
function week(){var t=today();if(t<SEM_START)return 0;return Math.min(14,Math.floor(diffDays(SEM_START,t)/7)+1);}

 return list.length?{d:list[0],set:true}:{d:DEFAULT_TARGET,set:false};}
function statusChip(st){
 if(st.p===0&&st.m===0)return '<span class="chip">Da iniziare</span>';
 var b=st.behind.length;
 if(b===0&&st.ahead>0)return '<span class="chip ahead">Avanti di '+st.ahead+'</span>';

 return '<span class="chip '+(b>=3?"late":"warn")+'">Indietro di '+b+'</span>';}

 if(a==="add-topic"){sheetAddTopic(ck,+el.dataset.s);return;}
 if(a==="appello"){sheetAppello(ck,el.dataset.id);return;}
 if(a==="del-app"){state.appelli[ck]=state.appelli[ck].filter(function(x){return x.id!==el.dataset.id;});closeSheet();commit();return;}
 if(a==="lesson"){sheetLesson(el.dataset.id);return;}
 if(a==="del-les"){state.lessons=state.lessons.filter(function(x){return x.id!==el.dataset.id;});closeSheet();commit();return;}
 if(a==="dl-new"){sheetDeadline(null);return;}
 if(a==="dl-own"){sheetDeadline(el.dataset.id);return;}
 if(a==="del-dl"){state.deadlines=state.deadlines.filter(function(x){return x.id!==el.dataset.id;});closeSheet();commit();return;}
 if(a==="past"){view.showPast=!view.showPast;render();return;}
 if(a==="grade"){sheetGrade(el.dataset.k);return;}
 if(a==="set-idon"){state.grades[el.dataset.k]={v:0,l:false,ok:true};closeSheet();commit();return;}
 if(a==="del-grade"){delete state.grades[el.dataset.k];closeSheet();commit();return;}
 if(a==="export"){exportBackup();return;}

});

function exportBackup(){
 var name="branduni-backup-"+iso(today())+".json";
 var data=JSON.stringify({app:"BRANDUNI",savedAt:new Date().toISOString(),state:state},null,1);
 function done(){state.lastBackup=iso(today());commit();}
 var file=null;try{file=new File([data],name,{type:"application/json"});}catch(e){}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(done,function(){});return;}
 try{var url=URL.createObjectURL(new Blob([data],{type:"application/json"}));var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);done();}catch(e){}
}
document.addEventListener("change",function(ev){if(ev.target.id!=="imp-file")return;var file=ev.target.files&&ev.target.files[0];if(!file)return;
 var r=new FileReader();r.onload=function(){var obj=null;try{obj=JSON.parse(r.result);}catch(e){}
  if(!obj||!obj.state||typeof obj.state!=="object"){openSheet('<h2>File non valido</h2><p class="small muted" style="margin:0">Questo file non è un backup di BRANDUNI. Scegli il file .json che hai salvato dall\'app.</p><button class="btn block" data-action="close">Ho capito</button>',function(){});return;}
  pendingImport=obj.state;var when=obj.savedAt?new Date(obj.savedAt):null;
  openSheet('<h2>Ripristinare il backup?</h2><p class="small muted" style="margin:0">'+(when&&!isNaN(when)?'Backup del '+fmtLong(new Date(when.getFullYear(),when.getMonth(),when.getDate()))+'. ':'')+'I dati attuali su questo telefono verranno sostituiti.</p><div class="acts"><button class="btn primary block" data-action="import-ok">Ripristina</button><button class="btn block" data-action="close">Annulla</button></div>',function(){});};
 r.readAsText(file);});
var profTimer=null;
document.addEventListener("input",function(ev){var ck=ev.target.dataset&&ev.target.dataset.prof;if(!ck)return;
 state.prof[ck]=ev.target.value.slice(0,80);saveLocal();clearTimeout(profTimer);profTimer=setTimeout(function(){if(docRef){clearTimeout(timer);timer=setTimeout(flush,200);}},600);});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&root.firstChild)closeSheet();});

render();
if(STANDALONE){
 document.getElementById("sync").hidden=true;
 var tl=document.getElementById("todaylbl");tl.hidden=false;
 var setToday=function(){var td=today();tl.textContent=(GIORNI[td.getDay()].slice(0,3)+" "+td.getDate()+" "+MESI[td.getMonth()]).toUpperCase();};setToday();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
 if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(function(){});}
 var lastDay=iso(today());
 document.addEventListener("visibilitychange",function(){if(!document.hidden&&iso(today())!==lastDay){lastDay=iso(today());setToday();render();}});
}else{
 initStore();
}
})();
